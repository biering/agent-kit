# The Design review pane (agent-kit README, "Design review"): every task on the work board that waits
# for the owner's design decision, across repos, with approve-to-build. One per machine, not per repo:
# link it once, from the kit's checkout or any repo's vendored copy:
#   herdr plugin link "<repo>/vendor/agent-kit/herdr-review"
# Commands run from this directory, without a shell: argv only.
id = "agent-kit.review"
name = "Design review"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Designs and plans waiting for your review, across repos: open the artifacts, approve to build, or send back"
platforms = ["macos", "linux"]

# prefix+y in the kit's herdr config: the pane beside the focused one (or focus it when it is open).
[[actions]]
id = "open"
title = "Open the Design review pane"
contexts = ["workspace", "pane"]
command = ["node", "../bin/agent-kit.mjs", "review", "open-pane"]

[[panes]]
id = "pane"
title = "Design review"
placement = "split"
command = ["/bin/sh", "-c", "cd \"${HERDR_PLUGIN_ROOT:?not launched by herdr}\" && exec node ../bin/agent-kit.mjs review pane"]

# One brief in Plannotator, opened by the pane as a split and moved to a new tab of the CEO's workspace.
[[panes]]
id = "doc"
title = "Review"
placement = "split"
command = ["/bin/sh", "-c", "cd \"${HERDR_PLUGIN_ROOT:?not launched by herdr}\" && exec node ../bin/agent-kit.mjs review doc"]

# A herdr notification when a design or a design plan becomes ready, also with the pane closed
# (at most one board read every 20 seconds).
[[events]]
on = "pane.agent_status_changed"
command = ["node", "../bin/agent-kit.mjs", "review", "notify"]
