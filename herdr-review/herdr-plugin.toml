# The review list pane (agent-kit README, "Review list"): everything on the work board that waits for the
# owner, newest first: specs to approve before a build, designs, results to ship, and the PRs that wait for
# his approval on GitHub (to open, not to approve), across repos. One per machine, not per repo:
# link it once, from the kit's checkout or any repo's vendored copy:
#   herdr plugin link "<repo>/vendor/agent-kit/herdr-review"
# Commands run from this directory, without a shell: argv only.
id = "agent-kit.review"
name = "Review list"
version = "0.3.0"
min_herdr_version = "0.9.0"
description = "Everything that waits for you, newest first: specs, designs and results to approve or send back with a key, and PRs to approve on GitHub"
platforms = ["macos", "linux"]

# prefix+y in the kit's herdr config: the pane below the work board (or focus it when it is open).
[[actions]]
id = "open"
title = "Open the review list"
contexts = ["workspace", "pane"]
command = ["node", "../bin/agent-kit.mjs", "review", "open-pane"]

[[panes]]
id = "pane"
title = "Review list"
placement = "split"
command = ["/bin/sh", "-c", "cd \"${HERDR_PLUGIN_ROOT:?not launched by herdr}\" && exec node ../bin/agent-kit.mjs review pane"]

# One brief or pitch in Plannotator, opened by the pane as a split and moved to a new tab of the CEO's workspace.
[[panes]]
id = "doc"
title = "Review"
placement = "split"
command = ["/bin/sh", "-c", "cd \"${HERDR_PLUGIN_ROOT:?not launched by herdr}\" && exec node ../bin/agent-kit.mjs review doc"]

# A herdr notification when a spec, a design, a design plan or a result becomes ready, also with the pane
# closed (at most one board read every 20 seconds).
[[events]]
on = "pane.agent_status_changed"
command = ["node", "../bin/agent-kit.mjs", "review", "notify"]
