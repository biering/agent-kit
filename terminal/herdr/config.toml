onboarding = false

[theme]
name = "dracula"
auto_switch = false

[ui]
# Wide enough for "repo · state · workspace · PR" without cutting every name.
sidebar_width = 34
sidebar_min_width = 32
sidebar_max_width = 44
# cockpit (quaresc/cockpit): one agent per space, so the tab row only shows in a
# space holding several tabs; blocked and finished agents float to the top.
hide_tab_bar_when_single_tab = true
agent_panel_sort = "priority"

# cockpit sends the system notifications itself (its icon, a click that leads
# to the agent), so herdr keeps its own as in-app toasts and none arrives twice.
[ui.toast]
delivery = "herdr"

# Agents in the sidebar as the work board shows them (herdr-projects docs/install.md):
# the board's own tab names hidden, the agent, then the task's summary and progress.
[ui.sidebar.agents]
rows = [["state_icon", "machine", "workspace", { token = "tab", rules = [{ equals = "Agent", hide = true }, { starts_with = "Reviewer #", hide = true }] }], ["agent"], [{ token = "$summary", dim = true }, "$progress"]]

# >>> maelstrom theme (~/.config/maelstrom-themes/switch replaces this block)
# Each workspace starts with its repo (Maelstrom green, Leverage in its
# leverage.immo brand blue, #564fff), then its branch and, for a board task,
# its summary and progress.
# Tokens come from `pnpm herdr sync` in the maelstrom repo (docs/herdr.md).
[ui.sidebar.spaces]
rows = [
  [
    { token = "$repo", fg = "#a3a39e", bold = true, rules = [
      { equals = "maelstrom", fg = "#75df8f" },
      { equals = "leverage", fg = "#564fff" },
    ] },
    "state_icon",
    "workspace",
  ],
  ["branch", "git_status"],
  # The work board (herdr-projects): the task's summary and progress.
  [{ token = "$summary", dim = true }, "$progress"],
]

# Hazard signage, dark (Maelstrom Console 02b): warm black panels, bone white
# text, greys for chrome, periwinkle #948ef5 as the accent (orange is red).
[theme.custom]
accent = "#948ef5"
panel_bg = "#0e0e0d"
sidebar_bg = "#0e0e0d"
active_row_bg = "#1a1a18"
selection_bg = "#2a2a28"
surface0 = "#1a1a18"
surface1 = "#262624"
surface_dim = "#0e0e0d"
overlay0 = "#3a3a37"
overlay1 = "#5a5a56"
text = "#edede8"
subtext0 = "#8a8a85"
mauve = "#948ef5"
green = "#c6ff3d"
yellow = "#ffd400"
red = "#ff5a1f"
blue = "#a3a39e"
teal = "#d8d8d0"
peach = "#ff8a5c"
# <<< maelstrom theme

# herdr-bar (jeffarese/herdr-bar): fuzzy-jump to any tab, agent, repo or
# branch. Cmd+K in Ghostty sends ctrl+alt+k (its config); prefix+f anywhere.
# Not prefix+k: that is herdr's "focus the pane above".
[[keys.command]]
key = ["prefix+f", "ctrl+alt+k"]
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

# herdr-dagr (aemrebarut/herdr-dagr): the run's live DAG in a split.
[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "herdr-dagr.open-dagr"
description = "open dagr run DAG in split"

# herdr-projects (eliasstravik/herdr-projects): the work board and its Coordinator.
[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "herdr-projects.open"
description = "work board"

# herdr-plugin-manager (speardragon/herdr-plugin-manager): install, update,
# enable and remove plugins. Not prefix+p: that is herdr's previous tab.
[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "plugin manager"

# The Maelstrom panel (maelstrom repo, ops/herdr-panel): swarm, needs you, board,
# in a pane on the left of the current one. Not prefix+g: that is herdr's goto.
[[keys.command]]
key = "prefix+i"
type = "plugin_action"
command = "maelstrom.panel.open"
description = "Maelstrom panel on the left"

# The Waiting for you pane (agent-kit herdr-review): designs, plans and PRs waiting for you, across
# repos, beside the current pane. Not prefix+r: that is herdr's resize mode.
[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "agent-kit.review.open"
description = "waiting for you (designs and PRs)"

# zoetrope (furkankly/zoetrope): the focused agent pane's session as a live
# flow graph, in its own full-screen tab. The same key closes it.
[[keys.command]]
key = "prefix+shift+z"
type = "plugin_action"
command = "furkankly.zoetrope.open-tab"
description = "zoetrope: session graph (own tab, full screen)"

# The work board as a side pane on the right of the current one, focus kept
# (maelstrom repo, ops/herdr-panel/board.sh). prefix+a still opens its own tab.
[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "maelstrom.panel.board"
description = "work board on the right"

# Herdr Annotate (plannotator/herdr-annotate): comment on terminal text, review
# documents and agent replies, send the notes to the agent. Four of the keys the
# plugin suggests are taken above (prefix+a, prefix+shift+a, prefix+m, prefix+d),
# so these differ from its README.
[[keys.command]]
key = "prefix+t"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[[keys.command]]
key = "prefix+shift+c"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+ctrl+a"
type = "plugin_action"
command = "annotate.copy-archive"
description = "copy annotations as context and archive them"

[[keys.command]]
key = "prefix+ctrl+v"
type = "plugin_action"
command = "annotate.paste-archive"
description = "paste annotations into the agent's prompt and archive them"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "annotate.send-archive"
description = "send annotations to the agent and archive them"

[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "annotate.open"
description = "review documents in this folder"

[[keys.command]]
key = "prefix+shift+o"
type = "plugin_action"
command = "annotate.last"
description = "review the agent's recent replies"

[[keys.command]]
key = "prefix+ctrl+o"
type = "plugin_action"
command = "annotate.last-newest"
description = "review the agent's newest reply"

# cockpit (quaresc/cockpit): only its keys that clash with none above. Its space
# jumps (inbox, to-do, runbook...) live in the Herdr app as cmd-alt-0..7, so the
# house keys keep prefix+i/t/a/d/u/m/f/y. ~/.config/cockpit/herdr follows the
# plugin's current install folder.
[[keys.command]]
key = "prefix+space"
type = "shell"
command = "sh ~/.config/cockpit/herdr/palette.sh"
description = "cockpit palette"

[[keys.command]]
key = "prefix+shift+q"
type = "shell"
command = "sh ~/.config/cockpit/herdr/popup.sh queue"
description = "prompt queue"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = "sh ~/.config/cockpit/herdr/popup.sh start-work"
description = "start work"

[[keys.command]]
key = "prefix+shift+u"
type = "shell"
command = "sh ~/.config/cockpit/herdr/cockpit.sh resume all"
description = "resume agents"
