<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moves</title>
<!-- The catalog, playing: every move in references/moves.md, four beats each, in the order the
     catalog lists them. It is a menu, not a film: the cells cut from one to the next, and what
     they show is filler. Render it to pick moves for a beat map:
       node $K/render.mjs <repo>/.agents/skills/launch-video/templates/moves.html --stills every:1 --out moves/ --contact moves.png
       node $K/render.mjs <repo>/.agents/skills/launch-video/templates/moves.html --serve
     A cell's id is the move's id in the catalog; keep the two in step. -->
<link rel="stylesheet" href="/.agents/skills/launch-video/templates/brand.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--app-body); }
  body { font-family: var(--sans); color: var(--ink); -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums; }
  #stage { position: absolute; inset: 0; overflow: hidden; background: var(--app-body); }
  .layer { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  .abs { position: absolute; }
  /* every cell is drawn on a 1920 x 1080 sheet and shown at 1.2x: nothing in a film is smaller than this */
  #cells > .layer { transform-origin: 960px 480px; transform: scale(1.2); }
  .mask { display: inline-block; overflow: hidden; vertical-align: bottom; padding: 0 0.04em 0.16em; margin: 0 -0.04em -0.16em; }
  .w { display: inline-block; white-space: pre; }
  .h { font: 600 104px/1.05 var(--sans); letter-spacing: -0.03em; }
  .card { position: absolute; background: #fff; border: 2px solid var(--border); border-radius: 18px; font: 600 30px/1.2 var(--app-sans); color: var(--text-highlighted); }
  .muted { color: var(--text-muted); font-weight: 500; }
  .bar { height: 16px; border-radius: 8px; background: var(--zinc-200); }
  .big { font: 700 96px/1 var(--app-display); letter-spacing: -0.02em; }
  svg.layer { overflow: visible; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  #index { left: 64px; top: 56px; font: 500 26px/1 var(--mono); color: var(--text-muted); z-index: 60; }
  #caption { z-index: 60; top: 936px; height: 88px; border-radius: 44px; background: var(--ink); border: 2px solid var(--zinc-600); overflow: hidden; }
  #caption span { position: absolute; left: 0; right: 0; top: 0; text-align: center; white-space: nowrap; font: 600 38px/84px var(--sans); color: #fff; }
  .band { z-index: 40; }
  .ring { z-index: 50; border-radius: 50%; border-style: solid; border-color: var(--brand-500); }
</style>
</head>
<body>
<div id="stage">
  <div id="index" class="abs"></div>
  <div id="cells"></div>
  <div id="caption" class="abs"></div>
</div>
<script src="/.agents/skills/launch-video/templates/kit.js"></script>
<script>
const { W, H, clamp, lerp, prog, ease, spring, springTo, camera, camCss, $, show, words, riseWords, bump, count, typed, draw, along, route, ring, wipe, edges, score, hud } = kit(1920, 1080)

// a cell runs on its own clock, so its times are written n * B; a film writes b(n)
const { BEAT } = score(120)
const B = BEAT
const SP = { freq: 2, damp: 0.72 }
const S = (u, at, o = SP) => Math.max(0, spring(u, at, o))
const fmt = (n, digits = 0) => n.toLocaleString(document.documentElement.lang, { minimumFractionDigits: digits, maximumFractionDigits: digits })
const px = (el, o) => Object.assign(el.style, Object.fromEntries(Object.entries(o).map(([k, v]) => [k, typeof v === 'number' ? `${v}px` : v])))
const POINTER = '<svg class="abs" width="44" height="44" viewBox="0 0 22 22" style="z-index:55"><path d="M4 2l13 9-6 1.2L8 18z" fill="#08070f" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>'
const CHECK = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/></svg>'

// ───────── the cells: [id, the caption, build(root) → draw(u)], u in seconds since the cell began ─────────
const CELLS = [
  ['tally', 'Items land, the total counts along', (root) => {
    const items = [['Item A', 29], ['Item B', 15], ['Item C', 89], ['Item D', 9], ['Item E', 54]]
    const at = [[330, 250, -5], [690, 330, 4], [1050, 240, -3], [1400, 340, 6], [860, 500, -2]]
    root.innerHTML = items.map(([n, v], i) => `<div class="card" style="left:${at[i][0]}px;top:${at[i][1]}px;width:300px;padding:26px 30px"><div class="muted">${n}</div><div style="font-size:40px;margin-top:8px">${v} $</div></div>`).join('')
      + '<div class="abs big" style="left:0;width:1920px;top:720px;text-align:center"></div>'
    const cards = [...root.querySelectorAll('.card')], total = root.lastChild
    const sum = items.map((_, i) => items.slice(0, i + 1).reduce((a, [, v]) => a + v, 0))
    return (u) => {
      cards.forEach((c, i) => { c.style.transform = `translateY(${-14 * bump(u, i * 0.5 * B + 0.12)}px) rotate(${at[i][2]}deg) scale(${S(u, i * 0.5 * B)})` })
      const n = sum.reduce((v, s, i) => count(u, i * 0.5 * B, 0.4 * B, v, s), 0)
      total.textContent = `${fmt(n)} $ a month`
      total.style.color = u > 2.4 * B ? 'var(--red)' : 'var(--text-highlighted)'
    }
  }],
  ['gather', 'Many become one', (root) => {
    const from = [[330, 250, -5], [690, 330, 4], [1050, 240, -3], [1400, 340, 6], [860, 560, -2]]
    root.innerHTML = from.map(([x, y]) => `<div class="card" style="left:${x}px;top:${y}px;width:300px;height:130px;padding:28px 30px"><div class="bar" style="width:60%"></div><div class="bar" style="width:85%;margin-top:18px"></div></div>`).join('')
      + '<div class="card" style="left:710px;top:300px;width:500px;height:300px;z-index:5;background:var(--brand-500);border:0;color:#fff;display:grid;place-items:center;font-size:54px">One place</div>'
    const cards = [...root.querySelectorAll('.card')].slice(0, 5), one = root.lastChild
    return (u) => {
      one.style.transform = `scale(${S(u, 1 * B)})`
      cards.forEach((c, i) => {
        const p = spring(u, 1 * B + i * 0.05, { freq: 1.8, damp: 0.85 })
        c.style.transform = `translate(${(810 - from[i][0]) * p}px,${(385 - from[i][1]) * p}px) rotate(${from[i][2] * (1 - p)}deg)`
      })
    }
  }],
  ['marker', 'One phrase takes the colour', (root) => {
    root.innerHTML = '<div class="abs h" style="left:200px;top:360px"><span class="mask"><span class="w">All</span></span> <span class="mask"><span class="w">in</span></span> <span style="position:relative;display:inline-block"><i class="abs" style="inset:6px -18px 2px;border-radius:14px;background:var(--brand-200);transform-origin:0 50%"></i><span class="mask" style="position:relative"><span class="w">one</span></span> <span class="mask" style="position:relative"><span class="w">place</span></span></span></div>'
    const ws = [...root.querySelectorAll('.w')], bar = root.querySelector('i')
    return (u) => {
      riseWords(ws, u, 0.2 * B)
      bar.style.transform = `scaleX(${ease.out(prog(u, 1.5 * B, 1.5 * B + 0.45))})`
    }
  }],
  ['typed', 'Typed, on fixed lines', (root) => {
    root.innerHTML = '<div class="card" style="left:460px;top:400px;width:1000px;height:140px;padding:0 44px;font-size:44px;line-height:136px;white-space:pre"><span></span><i style="display:inline-block;width:4px;height:52px;margin-left:4px;vertical-align:-8px;background:var(--brand-500)"></i></div>'
    const [text, caret] = root.firstChild.children
    return (u) => {
      const k = typed('Two-bed flat in Leeds', u, 0.5 * B)
      text.textContent = k.text
      show(caret, k.caret)
    }
  }],
  ['pointer', 'Pointer, click, ring', (root) => {
    root.innerHTML = `<div class="abs" style="left:760px;top:420px;width:400px;height:112px;border-radius:56px;background:var(--brand-500);color:#fff;font:600 40px/112px var(--app-sans);text-align:center">Calculate</div><div class="abs ring"></div>${POINTER}`
    const [btn, halo, ptr] = root.children
    const click = 2 * B, target = { x: 1000, y: 486 }
    return (u) => {
      const p = route(u, [[0, 1700, 900], [click - 0.12, target.x, target.y], [click + 0.5, target.x, target.y], [click + 1.3, 1500, 760]])
      px(ptr, { left: p.x - 8, top: p.y - 4 })
      // the press moves the button, it does not scale its label
      btn.style.transform = `translateY(${5 * bump(u, click, { freq: 3 })}px)`
      btn.style.background = u >= click && u < click + 0.12 ? 'var(--brand-600)' : 'var(--brand-500)'
      ring(halo, u, click, target)
    }
  }],
  ['wipe', 'A band changes the scene', (root) => {
    root.innerHTML = '<div class="abs" style="inset:0;background:var(--ink)"></div><div class="abs h" style="left:200px;top:400px;color:#fff"></div><div class="abs h" style="left:200px;top:400px"></div><div class="layer band" style="background:var(--brand-600)"></div><div class="layer band" style="background:var(--brand-200)"></div>'
    const [ground, after, before, band, band2] = root.children
    const a = words(before, 'Before'), z = words(after, 'After')
    return (u) => {
      const { covered } = wipe(band, u, 1.5 * B)
      wipe(band2, u, 1.5 * B + 0.07)
      show(ground, u >= covered); show(after, u >= covered); show(before, u < covered)
      riseWords(a, u, 0.2 * B)
      riseWords(z, u, covered + 0.1)
    }
  }],
  ['chain', 'A chain, one pulse', (root) => {
    const xs = [280, 810, 1340], labels = ['Inbox', 'Check', 'Result']
    root.innerHTML = `<svg class="layer" viewBox="0 0 1920 1080" stroke="var(--zinc-300)" stroke-width="5">${[0, 1].map((i) => `<path pathLength="1" d="M${xs[i] + 300} 470 C ${xs[i] + 380} 400, ${xs[i] + 450} 540, ${xs[i + 1]} 470"/>`).join('')}</svg>`
      + labels.map((l, i) => `<div class="card" style="left:${xs[i]}px;top:400px;width:300px;height:140px;text-align:center;line-height:136px;font-size:36px">${l}</div>`).join('')
      + '<div class="abs" style="width:26px;height:26px;border-radius:50%;background:var(--brand-500);z-index:6"></div>'
    const paths = [...root.querySelectorAll('path')], nodes = [...root.querySelectorAll('.card')], pulse = root.lastChild
    return (u) => {
      nodes.forEach((n, i) => {
        n.style.transform = `translateY(${-12 * bump(u, 2 * B + i * 0.5 * B)}px) scale(${S(u, i * 0.5 * B)})`
        n.style.borderColor = u >= 2 * B + i * 0.5 * B ? 'var(--brand-500)' : 'var(--border)'
      })
      paths.forEach((p, i) => draw(p, ease.out(prog(u, (i + 0.4) * 0.5 * B, (i + 1) * 0.5 * B + 0.1))))
      const leg = u < 2.5 * B ? 0 : 1, q = along(paths[leg], ease.inOut(prog(u, (2 + leg * 0.5) * B, (2.5 + leg * 0.5) * B)))
      show(pulse, u >= 2 * B && u < 3 * B)
      px(pulse, { left: q.x - 13, top: q.y - 13 })
    }
  }],
  ['chart', 'The line draws itself', (root) => {
    const kpis = [['Rent', 4820, ' $'], ['Yield', 5.4, ' %'], ['Units', 12, '']]
    root.innerHTML = kpis.map(([l], i) => `<div class="card" style="left:${360 + i * 410}px;top:190px;width:380px;padding:26px 30px"><div class="muted">${l}</div><div style="font:700 56px/1.2 var(--app-display)"></div></div>`).join('')
      + '<div class="card" style="left:360px;top:400px;width:1200px;height:440px"></div><svg class="layer" viewBox="0 0 1920 1080"><path id="area" fill="var(--brand-50)" stroke="none" d="M420 780 L420 720 C560 700 620 650 760 660 S980 560 1120 580 S1340 470 1500 450 L1500 780 Z"/><path pathLength="1" stroke="var(--brand-500)" stroke-width="7" d="M420 720 C560 700 620 650 760 660 S980 560 1120 580 S1340 470 1500 450"/></svg>'
    const values = [...root.querySelectorAll('.card > div:last-child')], [area, line] = root.querySelectorAll('path')
    return (u) => {
      const p = ease.inOut(prog(u, 0.5 * B, 2.5 * B))
      draw(line, p)
      area.style.clipPath = `inset(0 ${(1 - p) * 100}% 0 0)`
      values.forEach((v, i) => { v.textContent = fmt(count(u, 0.5 * B, 2 * B, 0, kpis[i][1], i === 1 ? 0.1 : 1), i === 1 ? 1 : 0) + kpis[i][2] })
    }
  }],
  ['checklist', 'One tick per beat', (root) => {
    const rows = ['Documents read', 'Numbers checked', 'Report written']
    root.innerHTML = rows.map((r, i) => `<div class="abs" style="left:560px;top:${300 + i * 130}px;display:flex;align-items:center;gap:32px;font:600 48px/1 var(--app-sans)"><div style="width:68px;height:68px;border-radius:50%;background:var(--zinc-200);display:grid;place-items:center">${CHECK}</div><span class="mask"><span class="w">${r}</span></span></div>`).join('')
    const dots = [...root.querySelectorAll('.abs > div')], ticks = [...root.querySelectorAll('path')], ws = [...root.querySelectorAll('.w')]
    return (u) => {
      ws.forEach((w, i) => riseWords([w], u, 0.1 + i * 0.12))
      dots.forEach((d, i) => {
        const at = (1 + i) * B
        d.style.background = u >= at ? 'var(--green)' : 'var(--zinc-200)'
        d.style.transform = `scale(${1 + 0.35 * bump(u, at)})`
        draw(ticks[i], ease.out(prog(u, at + 0.05, at + 0.3)))
      })
    }
  }],
  ['scan', 'A line finds the spot', (root) => {
    const rowY = (i) => 250 + i * 76
    root.innerHTML = '<div class="card" style="left:560px;top:180px;width:800px;height:620px;overflow:hidden">'
      + '<i class="abs" style="left:40px;width:716px;height:56px;border-radius:12px;background:var(--brand-100);transform-origin:0 50%"></i>'
      + [0, 1, 2, 3, 4, 5].map((i) => `<div class="bar abs" style="left:60px;top:${rowY(i) - 180 + 20}px;width:${[62, 80, 48, 72, 56, 84][i]}%"></div>`).join('')
      + '<i class="abs" style="left:0;width:800px;height:4px;background:var(--brand-500)"></i></div>'
      + '<div class="abs" style="left:1400px;padding:14px 26px;border-radius:14px;background:var(--ink);color:#fff;font:600 32px/1.2 var(--app-sans);transform-origin:0 50%">Found</div><div class="abs ring"></div>'
    const [hit, , , , , , , line] = root.firstChild.children, [, chip, halo] = root.children
    const found = 3, at = lerp(0.3 * B, 2.3 * B, (rowY(found) - 180) / 620)
    hit.style.top = `${rowY(found) - 180}px`
    chip.style.top = `${rowY(found) - 4}px`
    return (u) => {
      line.style.top = `${lerp(-4, 620, prog(u, 0.3 * B, 2.3 * B))}px`
      show(line, u >= 0.3 * B && u < 2.3 * B)
      hit.style.transform = `scaleX(${ease.out(prog(u, at, at + 0.35))})`
      chip.style.transform = `scale(${S(u, at + 0.15)})`
      ring(halo, u, at, { x: 600, y: rowY(found) + 28 }, { from: 10, to: 60, width: 8 })
    }
  }],
  ['race', 'Two runs, one is done', (root) => {
    const runs = [['New', 0.4, 'var(--brand-500)'], ['Before', 6.2, 'var(--zinc-400)']]
    root.innerHTML = runs.map(([l, , c], i) => `<div class="abs" style="left:360px;top:${310 + i * 220}px;width:1200px"><div style="display:flex;justify-content:space-between;font:600 40px/1 var(--app-sans)"><span>${l}</span><span></span></div><div style="margin-top:24px;height:36px;border-radius:18px;background:var(--zinc-200);overflow:hidden"><i style="display:block;height:100%;border-radius:18px;background:${c};transform-origin:0 50%"></i></div></div>`).join('')
    const rows = [...root.children].map((r) => ({ time: r.querySelector('span:last-child'), fill: r.querySelector('i') }))
    // one film second stands for two measured ones, so the slow run is still going when the cell ends
    return (u) => rows.forEach(({ time, fill }, i) => {
      const p = prog(u, 0.5 * B, 0.5 * B + runs[i][1] / 2)
      fill.style.transform = `scaleX(${p})`
      time.textContent = `${fmt(p * runs[i][1], 1)} s`
    })
  }],
  ['strike', 'The old value is struck', (root) => {
    root.innerHTML = '<div class="abs big" style="left:560px;top:430px;color:var(--text-muted)">78.00 $<i class="abs" style="left:-12px;right:-12px;top:46%;height:8px;border-radius:4px;background:var(--red);transform-origin:0 50%"></i></div><div class="abs big" style="left:1020px;top:430px;color:var(--brand-600)"><span class="mask"><span class="w">13.17 $</span></span></div>'
    const line = root.querySelector('i'), fresh = root.querySelector('.w')
    return (u) => {
      line.style.transform = `scaleX(${ease.out(prog(u, 1 * B, 1 * B + 0.3))})`
      riseWords([fresh], u, 1.5 * B)
    }
  }],
  ['edges', 'The leading edge runs ahead', (root) => {
    const tabs = ['Day', 'Week', 'Month'], tw = 300
    root.innerHTML = `<div class="abs" style="left:480px;top:410px;width:${tw * 3 + 24}px;height:132px;border-radius:66px;background:#fff;border:2px solid var(--border)"><i class="abs" style="top:10px;height:108px;border-radius:54px;background:var(--ink)"></i>${tabs.map((l, i) => `<span class="abs" style="left:${10 + i * tw}px;width:${tw}px;top:0;text-align:center;font:600 42px/128px var(--app-sans)">${l}</span>`).join('')}</div>`
    const knob = root.querySelector('i'), labels = [...root.querySelectorAll('span')]
    const stop = (i) => [10 + i * tw, 10 + (i + 1) * tw], at = [0, 1 * B, 2.2 * B]
    return (u) => {
      const e = edges(u, at.map((t, i) => [t, ...stop(i)]))
      px(knob, { left: e.left, width: e.right - e.left })
      const on = at.filter((t) => u >= t + 0.12).length - 1
      labels.forEach((l, i) => { l.style.color = i === Math.max(0, on) ? '#fff' : 'var(--text-muted)' })
    }
  }],
  ['bento', 'Tiles, one per half beat', (root) => {
    const tiles = [[360, 200, 580, 300, 'var(--brand-500)'], [960, 200, 290, 300, '#fff'], [1270, 200, 290, 300, 'var(--brand-100)'], [360, 520, 290, 300, 'var(--brand-100)'], [670, 520, 290, 300, '#fff'], [980, 520, 580, 300, 'var(--ink)']]
    root.innerHTML = tiles.map(([x, y, w, h, c]) => `<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;background:${c};padding:34px"><div class="bar" style="width:55%;opacity:.5"></div><div class="bar" style="width:80%;margin-top:18px;opacity:.5"></div></div>`).join('')
    const els = [...root.children]
    return (u) => els.forEach((e, i) => { e.style.transform = `scale(${S(u, 0.2 * B + i * 0.5 * B)})` })
  }],
  ['strip', 'The camera travels the row', (root) => {
    root.innerHTML = `<div class="layer">${['First', 'Second', 'Third'].map((l, i) => `<div class="card" style="left:${460 + i * 1920}px;top:260px;width:1000px;height:480px;padding:56px"><div style="font:700 72px/1 var(--app-display)">${l}</div><div class="bar" style="width:70%;margin-top:60px"></div><div class="bar" style="width:86%;margin-top:26px"></div><div class="bar" style="width:52%;margin-top:26px"></div></div>`).join('')}</div>`
    const world = root.firstChild, x = (i) => 960 + i * 1920
    return (u) => { world.style.transform = camCss(camera(u, [[0, 1, x(0), 540], [0.9 * B, 1, x(0), 540], [1.5 * B, 1, x(1), 540], [2.4 * B, 1, x(1), 540], [3 * B, 1, x(2), 540]])) }
  }],
  ['stamp', 'One word per beat, on colour', (root) => {
    const cards = [['Fast', 'var(--brand-600)', '#fff'], ['Checked', 'var(--ink)', '#fff'], ['Done', 'var(--brand-100)', 'var(--ink)']]
    root.innerHTML = cards.map(([, bg], i) => `<div class="layer" style="background:${bg};z-index:${10 + i * 2}"></div><div class="abs h" style="left:0;width:1920px;top:420px;text-align:center;font-size:190px;z-index:${11 + i * 2}"></div>`).join('')
    const sets = cards.map(([word, , ink], i) => { const h = root.children[i * 2 + 1]; h.style.color = ink; return { band: root.children[i * 2], h, ws: words(h, word) } })
    return (u) => sets.forEach(({ band, h, ws }, i) => {
      const at = (0.4 + i) * B, { covered } = wipe(band, u, at, { dur: 0.32, hold: true })
      show(h, u >= at)
      riseWords(ws, u, covered - 0.16, Infinity, 0.08, 0.4)
    })
  }],
]

const LEN = 4 * B
const DURATION = CELLS.length * LEN
let draws = [], capW = []

const ready = (async () => {
  await document.fonts.ready
  const cap = $('caption')
  draws = CELLS.map(([id, label, build]) => {
    const root = document.createElement('div')
    root.className = 'layer'
    root.dataset.move = id
    $('cells').append(root)
    const span = document.createElement('span')
    span.textContent = label
    cap.append(span)
    return { root, span, draw: build(root) }
  })
  // measured once, with no transform on anything: the caption's width per label
  capW = draws.map(({ span }) => { span.style.right = 'auto'; const w = span.offsetWidth + 112; span.style.right = '0'; return w })
})()

function seek(t) {
  const i = clamp(Math.floor(t / LEN), 0, CELLS.length - 1), u = t - i * LEN
  draws.forEach((d, j) => show(d.root, j === i))
  draws[i].draw(u)
  $('index').textContent = `${String(i + 1).padStart(2, '0')} / ${CELLS.length} · ${CELLS[i][0]}`
  // the caption: one shape, its width springs to each label, each label rises in and leaves upward
  const w = springTo(t, capW[0], capW.slice(1).map((v, j) => [(j + 1) * LEN, v]), { freq: 2.4, damp: 0.8 })
  px($('caption'), { left: W / 2 - w / 2, width: w })
  draws.forEach(({ span }, j) => {
    const pin = j ? ease.out(prog(t, j * LEN + 0.05, j * LEN + 0.4)) : 1
    const pout = j === draws.length - 1 ? 0 : ease.in(prog(t, (j + 1) * LEN - 0.2, (j + 1) * LEN + 0.05))
    span.style.transform = `translateY(${(1 - pin) * 110 - pout * 110}%)`
  })
}

window.film = { width: W, height: H, fps: 60, duration: DURATION, beat: BEAT, ready, seek: async (t) => { await ready; seek(t) } }
hud(window.film)
</script>
