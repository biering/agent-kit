<body>
<div id="stage"></div>
<!-- the kit gives the browser viewer (space plays, arrows step a twelfth of the loop); the engine does the film.
     The frame comes from the query: film.html?format=header|search -->

<script type="module">
import { build } from '/.agents/skills/launch-video/styles/ambient-loop/engine.js'
import spec from './spec.js'

const film = await build(spec)
window.film = film
kit(film.width, film.height).hud(film)
</script>
