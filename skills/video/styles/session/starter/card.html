<!-- The answer's card: the product's own screen in the chat, drawn by ../session.html into a box
     760 px wide (wide) or 468 px (reel). Each [data-row] is shown one at a time, every 0.35 s from
     the result; what stands above the first row shows with the card. It says "Example": the tasks
     are invented. Rebuild it from the product's real screen and tokens; a digit on it needs an
     entry in session.json's `sources`. -->
<style>
  .c-bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 14px; }
  .c-bar svg { color: var(--accent); }
  .c-bar span { margin-left: auto; font-weight: 500; color: var(--soft); }
  .c-bar em { margin-left: 10px; padding: 2px 8px; border-radius: 6px; background: var(--mine); font-style: normal; font-weight: 500; font-size: 12px; color: var(--soft); }
  .c-row { display: flex; align-items: center; height: 56px; padding: 0 18px; border-top: 1px solid var(--line); font-size: 15px; white-space: nowrap; }
  .c-row.c-head { height: 36px; border-top: 0; font-size: 12px; color: var(--soft); }
  .c-row .c-task { flex: 1; min-width: 0; }
  .c-row .c-col { flex: none; width: 124px; text-align: right; }
  .c-row b, .c-unit b { display: block; font-weight: 600; }
  .c-row small, .c-unit small { display: block; margin-top: 3px; font-size: 13px; color: var(--soft); }
  .c-unit { display: flex; align-items: center; height: 76px; padding: 0 18px; border-top: 1px solid var(--line); font-size: 15px; white-space: nowrap; }
  .c-unit > div { flex: 1; min-width: 0; }
  .c-unit .c-col { flex: none; width: 110px; text-align: right; }
  .c-blocked { color: #C2410C; font-weight: 600; }
</style>

<template data-shape="wide">
  <div class="c-bar"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/></svg>Product<span>Three tasks</span><em>Example</em></div>
  <div class="c-row c-head"><span class="c-task">Task</span><span class="c-col">Owner</span><span class="c-col">Status</span></div>
  <div class="c-row" data-row><span class="c-task"><b>Write the release notes</b><small>Docs · due Friday</small></span><span class="c-col">Ana</span><span class="c-col">In review</span></div>
  <div class="c-row" data-row><span class="c-task"><b>Fix the billing export</b><small>Billing · due Thursday</small></span><span class="c-col">Ben</span><span class="c-col c-blocked">Blocked</span></div>
  <div class="c-row" data-row><span class="c-task"><b>Plan the team offsite</b><small>People · due Wednesday</small></span><span class="c-col">Sam</span><span class="c-col">Open</span></div>
</template>

<template data-shape="reel">
